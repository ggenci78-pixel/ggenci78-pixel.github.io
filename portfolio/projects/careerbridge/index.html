<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
    <meta name="description" content="先看懂一份工作：从岗位工作样本了解日常任务、交付物与入门方向。">
  <title>CareerBridge · 低保真原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <div class="prototype-notice">低保真原型 <span>人物、内容与机会均为示例 · 无真实发布或投递</span></div>
  <header class="app-header">
    <a class="brand" href="#/discover" aria-label="CareerBridge 首页">CareerBridge<span>看懂岗位，找到入门方向</span></a>
    <div class="header-actions">
      <button class="icon-button" type="button" data-action="compose" aria-label="写一个问题" title="写一个问题"><i data-lucide="square-pen" aria-hidden="true"></i></button>
      <button class="icon-button" type="button" data-action="preferences" aria-label="探索偏好" title="探索偏好"><i data-lucide="settings-2" aria-hidden="true"></i></button>
    </div>
  </header>
  <div class="app-shell">
    <nav class="primary-nav" aria-label="主导航">
      <a href="#/discover" data-nav="discover"><i data-lucide="compass" aria-hidden="true"></i><span>看岗位</span></a>
      <a href="#/peers" data-nav="peers"><i data-lucide="messages-square" aria-hidden="true"></i><span>同行</span></a>
      <a href="#/opportunities" data-nav="opportunities"><i data-lucide="briefcase-business" aria-hidden="true"></i><span>机会</span></a>
      <a href="#/me" data-nav="me"><i data-lucide="user-round" aria-hidden="true"></i><span>我的</span></a>
      <p class="nav-note">示例内容<br>仅当前浏览器保存</p>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <p class="storage-notice" id="storage-notice" role="status" hidden></p>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="editor-dialog" aria-labelledby="dialog-title"></dialog>
  <noscript>此交互原型需要启用 JavaScript。</noscript>
  <script src="../../assets/js/lucide.min.js"></script>
  <script type="module" src="app.mjs"></script>

</html>
